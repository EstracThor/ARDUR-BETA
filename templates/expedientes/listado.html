{% extends 'base.html' %}{% block content %}<form class="filters"><input class="form-control" name="estado" placeholder="Filtrar estado, ej. CERRADO" value="{{ request.GET.estado }}"><button class="btn btn-outline-primary">Filtrar</button></form><section class="panel table-responsive"><table class="table"><thead><tr><th>Expediente</th><th>Cliente</th><th>Orden</th><th>Estado</th></tr></thead><tbody>{% for e in page %}<tr><td><a href="{% url 'fin-expediente' e.pk %}">{{ e }}</a></td><td>{{ e.cliente.nombres }}</td><td><a href="{% url 'fin-orden' e.orden_id %}">{{ e.orden }}</a></td><td>{{ e.estado }}</td></tr>{% empty %}<tr><td colspan="4">No hay expedientes.</td></tr>{% endfor %}</tbody></table>{% include 'pagination.html' %}</section>{% endblock %}
